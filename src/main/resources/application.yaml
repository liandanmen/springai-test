server:
  port: 8081

spring:
  application:
    name: springai-test
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:springai}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
  flyway:
    baseline-on-migrate: true
    baseline-version: 2
    locations: classpath:db/migration
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-v4-flash
    openai:
      base-url: https://ws-oxshmqxdh9f1jmrs.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api-key: ${OPENAI_API_KEY}
      chat:
        model: qwen3.8-flash
        temperature: 0.7
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 1

springai:
  jwt:
    user-secret-key: ${JWT_USER_SECRET_KEY:}
    user-ttl: 86400000
    user-token-name: Authorization

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    com.example.springaitest: DEBUG
