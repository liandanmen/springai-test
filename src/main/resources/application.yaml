server:
  port: 8081

spring:
  application:
    name: springai-test
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:springai}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
  flyway:
    baseline-on-migrate: true
    baseline-version: 2
    locations: classpath:db/migration
    enabled: true
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-v4-flash
    openai:
      base-url: https://ws-oxshmqxdh9f1jmrs.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      api-key: ${OPENAI_API_KEY}
      chat:
        model: qwen3.8-flash
        temperature: 0.7
      embedding:
        options:
          model: text-embedding-v4
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 1

  servlet:
    multipart:
      enabled: true
      max-file-size: 2MB
      max-request-size: 4MB

springai:
  jwt:
    user-secret-key: ${JWT_USER_SECRET_KEY:}
    user-ttl: 86400000
    user-token-name: Authorization
  # 知识库检索参数：默认值由 RAG_EVAL.md 的评测结论得出，调参不用改代码
  kb:
    chunk-size: 300              # 每块 token 上限；评测中 300 的 hit@1 显著优于 500
    top-k: 5                     # 召回条数
    similarity-threshold: 0.30   # 低于该值的块丢弃
    index-file: data/vector-index.json   # 向量索引落盘路径
    rebuild-on-start: false      # true = 每次启动强制从数据库重建（会重新调 embedding）

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    org.example.springaitest: DEBUG
